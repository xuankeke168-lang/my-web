          - heading "为什么你的财务可视化，90%是废的？" [level=1] [ref=e24]
          - generic [ref=e25]:
            - generic [ref=e26]: BI系统
            - generic [ref=e27]: 数据驱动
            - generic [ref=e28]: 报表设计
            - generic [ref=e29]: Dashboard
            - generic [ref=e30]: 油田财务
        - generic [ref=e31]:
          - paragraph [ref=e32]: "**\"我们花200万上了BI系统，做了200多张报表。老板说'挺好'，然后继续要手工表。\"**"
          - paragraph [ref=e33]: 这句话是一个油田企业财务主任跟我说的。
          - paragraph [ref=e34]: 他不是个案。我见过几十家企业的财务数字化，能真正用数据驱动决策的，不超过10%。
          - paragraph [ref=e35]: 大部分企业的财务可视化是这样的：
          - paragraph [ref=e36]: 200万买的系统，200张报表，0实际应用。
          - paragraph [ref=e37]: 问题在哪？
          - paragraph [ref=e38]: "---"
          - heading "数据可视化失败的3个真凶" [level=2] [ref=e39]
          - heading "真凶1：报表驱动，而非问题驱动" [level=3] [ref=e40]
          - paragraph [ref=e41]: 财务部门做可视化，第一反应是"我要把所有数据都可视化"。
          - paragraph [ref=e42]: 结果：200张报表，80%没人看过。
          - paragraph [ref=e43]: 正确的思路是"我要解决什么问题"，然后"哪些数据能帮我解决这个问题"。
          - paragraph [ref=e44]: 开两周的会，列出10个核心问题。然后围绕问题做报表，不是围绕数据。
          - heading "真凶2：技术部门主导，业务部门缺席" [level=3] [ref=e45]
          - paragraph [ref=e46]: 某能源集团上财务系统，IT部门招标选型，财务部门培训使用。
          - paragraph [ref=e47]: 上线三个月，财务在用，但老板不用。
          - paragraph [ref=e48]: 原因很简单：系统是IT设计的，界面是IT想的，业务逻辑是IT猜的。财务只是被迫使用者。
          - paragraph [ref=e49]: 财务可视化能不能用起来，关键看老板用不用。而老板用不用，关键看系统有没有解决他真正的问题。
          - paragraph [ref=e50]: "**设计时没让老板参与，用的时候老板就不参与。**"
          - heading "真凶3：一次性交付，无持续运营" [level=3] [ref=e51]
          - paragraph [ref=e52]: BI系统上线那天是巅峰。然后就再也没有然后了。
          - paragraph [ref=e53]: 数据不更新，报表不迭代，异常没人管。三个月后，系统变成电子废墟。
          - paragraph [ref=e54]: 财务可视化不是项目，是运营。
          - paragraph [ref=e55]: "---"
          - heading "一张图看透财务可视化失败的根因" [level=2] [ref=e56]
          - paragraph [ref=e57]: "```"
          - paragraph [ref=e58]: 你以为的路径：
          - paragraph [ref=e59]: 数据采集 → 数据清洗 → 报表制作 → 老板使用
          - paragraph [ref=e60]: ↓
          - paragraph [ref=e61]: 实际情况：
          - paragraph [ref=e62]: 数据采集（没人维护）→ 数据清洗（口径乱）→ 报表制作（没人看）→ 老板（要手工表）
          - paragraph [ref=e63]: "```"
          - paragraph [ref=e64]: 根因就一个：**你做的不是老板需要的。**
          - paragraph [ref=e65]: "---"
          - heading "财务可视化的3个段位，你在哪一段？" [level=2] [ref=e66]
          - paragraph [ref=e67]: "**段位1：数据搬家**"
          - paragraph [ref=e68]: 把Excel表搬进BI系统，图表更好看了，但分析逻辑没变。
          - paragraph [ref=e69]: 老板问："然后呢？"你答不上来。
          - paragraph [ref=e70]: "**段位2：数据展示**"
          - paragraph [ref=e71]: 能按时间/部门/项目拆解数据了，能看到异常了。
          - paragraph [ref=e72]: 老板问："为什么这样？"你能解释了。
          - paragraph [ref=e73]: "**段位3：数据驱动**"
          - paragraph [ref=e74]: 能预测趋势了，能给决策建议了。
          - paragraph [ref=e75]: 老板问："怎么办？"你能给方案了。
          - paragraph [ref=e76]: 大多数企业在段位1。段位2是门槛。段位3是目标。
          - paragraph [ref=e77]: "---"
          - heading "让财务可视化活过来的4步法" [level=2] [ref=e78]
          - paragraph [ref=e79]: 不是理论，是踩了无数坑之后总结的。
          - heading "第1步：找1个老板最痛的点（别贪多）" [level=3] [ref=e80]
          - paragraph [ref=e81]: 某油田财务总监最痛的是：老板每个月追问"这个井是赚是亏"，他们要花3天才能算出来。
          - paragraph [ref=e82]: 不是200个指标，就1个问题：**单井成本核算**。
          - paragraph [ref=e83]: 他们的做法：选一个最痛的点，打通数据，做成看板，给老板看。老板说"这个有用"，然后才扩展到下一个。
          - paragraph [ref=e84]: "**你的第一个仪表盘，不应该是什么\"经营全景图\"，应该是老板问得最多的那个问题。**"
          - heading "第2步：让老板参与设计（第1天就开始）" [level=3] [ref=e85]
          - paragraph [ref=e86]: 不是上线了让老板审，是设计时就问老板：
          - listitem [ref=e87]: 你每天最关注什么数字？
          - listitem [ref=e88]: 你做决策时最缺什么数据？
          - listitem [ref=e89]: 什么样的展示你能直接看懂？
          - paragraph [ref=e90]: 某能源企业财务部做Dashboard之前，先问了老板5个问题：
          - paragraph [ref=e91]: "```"
          - paragraph [ref=e92]: 1. 你每天第一个看的数字是什么？
          - paragraph [ref=e93]: 2. 你最怕突然接到什么电话？（数据相关）
          - paragraph [ref=e94]: 3. 你觉得现在财务给你的东西缺什么？
          - paragraph [ref=e95]: 4. 你希望什么时候能看到数据？（T+0？T+1？）
          - paragraph [ref=e96]: 5. 你看数据时有什么习惯？（手机？电脑？早上还是晚上？）
          - paragraph [ref=e97]: "```"
          - paragraph [ref=e98]: 问完才知道，他们做的第一个仪表盘应该是**"今天资金余额+本周到期应付款"**，不是他们原本想的"收入利润全景图"。
          - heading "第3步：设置\"数据预警\"，不是\"数据展示\"" [level=3] [ref=e99]
          - paragraph [ref=e100]: 大部分BI系统是展示数据的。但真正有用的，是预警数据。
          - paragraph [ref=e101]: 差在哪：
          - paragraph [ref=e102]: "```"
          - paragraph [ref=e103]: 错误：展示"本月成本1000万"
          - paragraph [ref=e104]: 正确：预警"本月成本1000万，超预算18%，需审批"
          - paragraph [ref=e105]: "```"
          - paragraph [ref=e106]: 展示数据，人看了，然后没有然后。
          - paragraph [ref=e107]: 预警数据，人收到了，必须做点什么。
          - paragraph [ref=e108]: "**每张报表配一个预警规则。这是财务可视化从\"好看\"到\"有用\"的关键。**"
          - heading "第4步：建运营机制，不是建系统" [level=3] [ref=e109]
          - paragraph [ref=e110]: 系统上线后，每周看数据的人是谁？每月更新报表的是谁？每个季度迭代功能的是谁？
          - paragraph [ref=e111]: 没有运营，系统3个月死掉。
          - paragraph [ref=e112]: 某集团财务部的做法：
          - paragraph [ref=e113]: "```"
          - paragraph [ref=e114]: 每周一：数据负责人检查数据质量（异常标红）
          - paragraph [ref=e115]: 每周三：财务经理看核心指标预警（超阈值推送到钉钉）
          - paragraph [ref=e116]: 每月末：复盘本月预警准确率，调整阈值
          - paragraph [ref=e117]: 每季度：问老板"最近什么问题没解决"，迭代Dashboard
          - paragraph [ref=e118]: "```"
          - paragraph [ref=e119]: 不需要IT驻场，不需要开发新功能。就是一个人，每周花30分钟维护。
          - paragraph [ref=e120]: "---"
          - heading "实操模板：财务可视化问题清单" [level=2] [ref=e121]
          - paragraph [ref=e122]: 做下一个Dashboard之前，先回答这10个问题：
          - paragraph [ref=e123]: "```"
          - paragraph [ref=e124]: □ 老板问这个问题吗？（不问的不做）
          - paragraph [ref=e125]: □ 这个数据能改变什么决策？（改变不了的别做）
          - paragraph [ref=e126]: □ 数据从哪来，更新频率多少，谁负责？
          - paragraph [ref=e127]: □ 数据口径是什么？和老板理解的一致吗？
          - paragraph [ref=e128]: □ 超过正常范围谁来处理？怎么处理？
          - paragraph [ref=e129]: □ 这个报表多久看一次？谁来看？
          - paragraph [ref=e130]: □ 看完之后做什么？（没有"然后"的不做）
          - paragraph [ref=e131]: □ 三个月后谁维护？谁更新？
          - paragraph [ref=e132]: □ 用不起来谁来推动？
          - paragraph [ref=e133]: □ 如果老板只能留一张报表，他留哪张？
          - paragraph [ref=e134]: "```"
          - paragraph [ref=e135]: 10个问题里有3个答不上来，这个项目先缓缓。
          - paragraph [ref=e136]: "---"
          - heading "行动清单" [level=2] [ref=e137]
          - listitem [ref=e138]: "[ ] 今天：问老板一个具体问题，\"您现在最缺什么数据？\""
          - listitem [ref=e139]: "[ ] 本周：找出你部门被问得最多的3个财务问题"
          - listitem [ref=e140]: "[ ] 本周：从3个问题里选1个，评估能不能用数据解决"
          - listitem [ref=e141]: "[ ] 本月：围绕1个问题设计第一个Dashboard，不求多，只求有用"
          - listitem [ref=e142]: "[ ] 下季度：如果第一个Dashboard老板用了，复制到下一个问题"
          - paragraph [ref=e143]: "---"
          - paragraph [ref=e144]: "**金句**"
          - blockquote [ref=e145]: 财务可视化失败的根本原因，不是技术不够，是你没有问过老板真正想要什么。
          - paragraph [ref=e146]: "**互动问题**"
          - blockquote [ref=e147]: 你们公司现在有多少张"电子废墟"报表？评论区说说，我挑几个典型问题下期给方案。
